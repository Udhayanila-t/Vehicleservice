<!DOCTYPE html>
<html>
<head>
    <title>Available Services</title>

    <style>
        body{
            font-family: Arial;
            text-align:center;
            background: url('car-bg.jpg') no-repeat center center/cover;
        }

        .container{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:20px;
            margin-top:40px;
        }

        .card{
            background:white;
            width:250px;
            padding:20px;
            border-radius:15px;
            box-shadow:0px 5px 15px rgba(0,0,0,0.3);
        }

        .selected{
            border:3px solid green;
        }

        button{
            padding:8px 15px;
            margin-top:10px;
            background:orange;
            color:white;
            border:none;
            cursor:pointer;
        }

        .next-btn{
            margin-top:30px;
            padding:12px 25px;
            background:green;
            color:white;
            border:none;
        }

        /* 🔥 FREE CARD STYLE */
        .free-card{
            border:3px solid green;
            background:#eaffea;
        }
    </style>
</head>

<body>

<h2>🚗 Available Services</h2>

<div class="container" id="serviceContainer">

    <!-- 🎁 FREE SERVICE CARD -->
    <div class="card free-card" onclick="openFreeService()">
        <h3>🎁 Free Service</h3>
        <p>Only for First-Time Users</p>
        <button>View Details</button>
    </div>

</div>

<button class="next-btn" onclick="goNext()">Next → Booking</button>

<script>

    let selectedServices = [];

    // Load services
    fetch("http://localhost:8080/services")
    .then(res=>res.json())
    .then(data=>{

        let container=document.getElementById("serviceContainer");

        data.forEach(service=>{

            let card=document.createElement("div");
            card.classList.add("card");

            card.innerHTML=`
            <h3>${service.serviceName}</h3>
            <p>${service.description || ""}</p>
            <p>₹${service.price}</p>
            <button onclick="selectService('${service.serviceName}', this)">Select</button>
            `;

            container.appendChild(card);
        });

    });

    // Select multiple services
    function selectService(name,btn){

        if(selectedServices.includes(name)){
            selectedServices = selectedServices.filter(s=>s!==name);
            btn.parentElement.classList.remove("selected");
        }else{
            selectedServices.push(name);
            btn.parentElement.classList.add("selected");
        }
    }

    // 🎁 FREE SERVICE FUNCTION
    function openFreeService(){

        let userName = localStorage.getItem("userName");

        fetch("http://localhost:8080/booking")
        .then(res=>res.json())
        .then(data=>{

            let userBookings = data.filter(b => b.userName === userName);

            // ❌ Already used
            if(userBookings.length > 0){
                alert("❌ Free service already used");
                return;
            }

            // ✅ Show details
            let confirmMsg = confirm(
                "🎁 FREE SERVICE DETAILS:\n\n" +
                "✔ Water Wash FREE\n" +
                "✔ Inspection FREE\n\n" +
                "Do you want to continue?"
            );

            if(confirmMsg){

                let freeServices = ["Water Wash", "Inspection"];

                localStorage.setItem("services", JSON.stringify(freeServices));

                window.location.href="booking.html";
            }

        });

    }

    // Go to booking
    function goNext(){

        if(selectedServices.length===0){
            alert("Select at least one service");
            return;
        }

        localStorage.setItem("services", JSON.stringify(selectedServices));

        window.location.href="booking.html";
    }

</script>

</body>
</html>
